apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-demo
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-demo
  template:
    metadata:
      labels:
        app: k8s-demo
    spec:
      containers:
        - name: k8s-demo
          image: vedantkhuje14/k8s-demo:1.1
          ports:
            - containerPort: 8080
